<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SkyLook</title>
<script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #06090F; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #fff;
  }

  /* ── Responsive sidebar widths via clamp() ───────────────────── */
  /* min 180, ideal 18% of viewport, max 320 (left)  /  max 360 (right) */
  :root {
    --left-w:  clamp(180px, 18vw, 320px);
    --right-w: clamp(200px, 20vw, 360px);
    --pad-side: clamp(14px, 1.8vw, 32px);
    --pad-top:  clamp(14px, 2.5vh, 32px);
    --gap:      clamp(10px, 1.6vh, 18px);
  }

  /* Very small displays (e.g. Nest Hub 1024×600 with extra chrome): trim right panel */
  @media (max-width: 1100px) {
    :root { --right-w: clamp(180px, 26vw, 260px); }
  }
  /* Tiny: hide right panel entirely, the compass + left list is enough */
  @media (max-width: 720px) {
    :root { --right-w: 0px; }
    #right { display: none !important; }
  }

  /* ── Layout ───────────────────────────────────────────────────── */
  #app { display: flex; width: 100%; height: 100%; }

  #left {
    width: var(--left-w); flex-shrink: 0; height: 100%;
    background: rgba(0,0,0,.28);
    padding: var(--pad-top) var(--pad-side);
    display: flex; flex-direction: column; gap: var(--gap);
    overflow: hidden;
  }
  #center {
    flex: 1; min-width: 0; height: 100%;
    display: flex; align-items: center; justify-content: center;
    position: relative; padding: clamp(12px, 2vw, 40px);
  }
  #right {
    width: var(--right-w); flex-shrink: 0; height: 100%;
    background: rgba(0,0,0,.28);
    padding: var(--pad-top) var(--pad-side);
    overflow-y: auto;
    display: flex; flex-direction: column;
  }

  /* ── Left: clock ─────────────────────────────────────────────── */
  #clock {
    font-size: clamp(32px, 4.6vw, 56px);
    font-weight: 200; letter-spacing: -1px; color: #fff; line-height: 1;
  }

  /* ── Left: stat pills ────────────────────────────────────────── */
  #stats-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat-pill {
    background: rgba(77,166,255,.1); border-radius: 10px;
    padding: 7px 11px; display: flex; flex-direction: column; min-width: 70px;
  }
  .stat-pill.purple { background: rgba(167,139,250,.1); }
  .stat-pill .val { font-size: clamp(15px, 1.5vw, 20px); font-weight: 700; color: #4DA6FF; line-height: 1.1; }
  .stat-pill.purple .val { color: #A78BFA; }
  .stat-pill .lbl { font-size: 10px; color: rgba(77,166,255,.6); }
  .stat-pill.purple .lbl { color: rgba(167,139,250,.6); }

  /* ── Left: freshness ─────────────────────────────────────────── */
  #freshness { font-size: 10px; font-weight: 600; letter-spacing: .5px; align-self: flex-start; }
  #freshness.live { color: rgba(77,166,255,.6); }
  #freshness.stale { color: rgba(248,113,113,.6); }
  #freshness.demo {
    color: rgba(167,139,250,.8); background: rgba(167,139,250,.15);
    padding: 3px 6px; border-radius: 4px;
  }

  /* ── Left: divider ───────────────────────────────────────────── */
  .divider { border: none; border-top: 1px solid rgba(255,255,255,.07); margin: 4px 0; }

  /* ── Left: section labels ────────────────────────────────────── */
  .section-lbl { font-size: 10px; font-weight: 700; letter-spacing: .8px; color: rgba(255,255,255,.3); margin-bottom: 6px; }
  #tracked-section .section-lbl { color: rgba(77,166,255,.7); }

  /* ── Flight rows ─────────────────────────────────────────────── */
  #nearby-list { flex: 1; overflow-y: auto; min-height: 0; }
  .flight-row {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 6px; border-radius: 8px;
    transition: background .15s;
  }
  .flight-row.focused { background: rgba(77,166,255,.12); }
  .flight-row.dimmed { opacity: .35; }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .flight-info { flex: 1; min-width: 0; }
  .flight-callsign {
    font-size: clamp(11px, 1vw, 14px); font-weight: 600; color: #fff;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .flight-route {
    font-size: 10px; color: rgba(255,255,255,.4);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .flight-dist { font-size: 10px; color: rgba(255,255,255,.4); flex-shrink: 0; }

  /* ── Center: square wrap for the compass canvas ──────────────── */
  #compass-wrap {
    aspect-ratio: 1 / 1;
    max-width: 100%;
    max-height: 100%;
    width: 100%;            /* shrink from width if needed */
    height: auto;
    position: relative;
  }
  /* When viewport is more landscape than the wrap, switch to height-bound */
  @supports (aspect-ratio: 1 / 1) {
    #compass-wrap { width: auto; height: 100%; }
  }
  #compass { display: block; width: 100%; height: 100%; }

  #watermark {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    font-size: 11px; font-weight: 300; letter-spacing: 3px;
    color: rgba(255,255,255,.07); pointer-events: none;
  }

  /* ── Right: detail panel ─────────────────────────────────────── */
  .detail-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .airline-logo {
    width: clamp(40px, 4vw, 56px); aspect-ratio: 1/1; border-radius: 12px;
    background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center;
    font-size: clamp(14px, 1.4vw, 18px); font-weight: 700; color: rgba(255,255,255,.7); flex-shrink: 0;
  }
  .detail-callsign {
    font-size: clamp(20px, 2vw, 28px); font-weight: 700; color: #fff;
    overflow-wrap: break-word;
  }
  .detail-airline { font-size: clamp(11px, 1vw, 14px); color: rgba(255,255,255,.55); margin-top: 2px; }
  .interesting-badge {
    display: inline-block; background: rgba(167,139,250,.15); color: #A78BFA;
    font-size: 11px; padding: 2px 5px; border-radius: 4px; margin-left: 8px; vertical-align: middle;
  }

  .where-box { border-radius: 12px; padding: 12px; margin-bottom: 14px; }
  .where-label { font-size: 9px; font-weight: 800; letter-spacing: 1px; margin-bottom: 4px; }
  .where-text { font-size: clamp(14px, 1.4vw, 18px); font-weight: 600; color: #fff; }

  .route-card {
    background: rgba(255,255,255,.05); border-radius: 12px;
    padding: 14px; margin-bottom: 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .route-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .route-iata { font-size: clamp(16px, 1.7vw, 22px); font-weight: 700; color: #fff; }
  .route-city { font-size: 10px; color: rgba(255,255,255,.45); margin-top: 1px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .route-arrow { font-size: 16px; flex-shrink: 0; }
  .progress-track { height: 3px; background: rgba(255,255,255,.08); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 2px; }

  .stats-grid { display: flex; flex-direction: column; gap: 7px; }
  .stat-row { display: flex; justify-content: space-between; gap: 8px; }
  .stat-lbl { font-size: clamp(11px, 1vw, 13px); color: rgba(255,255,255,.4); flex-shrink: 0; }
  .stat-val { font-size: clamp(11px, 1vw, 13px); font-weight: 500; color: #fff;
    text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── Right: idle panel ───────────────────────────────────────── */
  #idle-panel {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .idle-plane { font-size: clamp(36px, 4vw, 52px); display: block; margin-bottom: 16px; }
  .idle-title { font-size: clamp(20px, 2.2vw, 30px); font-weight: 200; letter-spacing: 2px; color: rgba(255,255,255,.55); margin-bottom: 10px; }
  .idle-sub { font-size: clamp(11px, 1vw, 13px); color: rgba(255,255,255,.3); text-align: center; line-height: 1.6; }

  /* ── Error toast (visible if cast message parsing fails) ─────── */
  #err {
    position: fixed; bottom: 8px; right: 12px;
    background: rgba(248,113,113,.15); color: #F87171;
    font-size: 10px; padding: 6px 10px; border-radius: 6px;
    max-width: 360px; display: none; z-index: 1000;
  }
</style>
</head>
<body>
<div id="app">
  <!-- Left panel -->
  <div id="left">
    <div id="clock">--:--</div>
    <div id="stats-row">
      <div class="stat-pill" id="aircraft-pill">
        <span class="val" id="aircraft-count">0</span>
        <span class="lbl">aircraft</span>
      </div>
      <div class="stat-pill purple" id="tracked-pill" style="display:none">
        <span class="val" id="tracked-count">0</span>
        <span class="lbl">tracked</span>
      </div>
    </div>
    <div id="freshness" class="demo">DEMO DATA</div>
    <hr class="divider">
    <div id="tracked-section" style="display:none">
      <div class="section-lbl">TRACKED</div>
      <div id="tracked-list"></div>
      <hr class="divider">
    </div>
    <div class="section-lbl">NEARBY</div>
    <div id="nearby-list"></div>
  </div>

  <!-- Center compass -->
  <div id="center">
    <div id="compass-wrap">
      <canvas id="compass"></canvas>
      <div id="watermark">SkyLook</div>
    </div>
  </div>

  <!-- Right panel -->
  <div id="right">
    <div id="detail-panel" style="display:none"></div>
    <div id="idle-panel">
      <span class="idle-plane">✈</span>
      <div class="idle-title">SkyLook</div>
      <div class="idle-sub">Tap any aircraft on your phone<br>to see it here.</div>
    </div>
  </div>
</div>

<div id="err"></div>

<script>
// ── Configuration ────────────────────────────────────────────────
const DEFAULT_LAT = 51.5074;
const DEFAULT_LON = -0.1278;
const RADIUS_NM   = 30;
const POLL_MS     = 30_000;

// ── State ────────────────────────────────────────────────────────
let state = { flights: [], trackedIds: [], focusedFlightId: null, unitSystem: 'METRIC', lastUpdated: null };

function updateState(s) {
  // Merge so partial updates don't wipe other fields
  state = Object.assign({}, state, s);
  render();
}

function showErr(msg) {
  const el = document.getElementById('err');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 5000);
}

// ── Cast receiver setup ──────────────────────────────────────────
let phoneActive = false;
try {
  const castContext = cast.framework.CastReceiverContext.getInstance();

  castContext.addCustomMessageListener('urn:x-cast:com.skylook.flights', e => {
    try {
      const data = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
      console.log('SkyLook: cast message', data);
      updateState(data);
      phoneActive = true;
    } catch (err) {
      console.error('SkyLook: bad cast message', err, e.data);
      showErr('Cast parse error: ' + err.message);
    }
  });

  castContext.addEventListener(
    cast.framework.system.EventType.SENDER_DISCONNECTED,
    () => { phoneActive = false; console.log('SkyLook: sender disconnected'); }
  );

  castContext.start({ disableIdleTimeout: true });
} catch (err) {
  console.warn('SkyLook: Cast SDK unavailable (browser preview?)', err);
}

// ── Airline tables ───────────────────────────────────────────────
const AIRLINES = {
  AAL:'American Airlines', AFR:'Air France', AIC:'Air India', ANZ:'Air New Zealand',
  AUA:'Austrian Airlines', BAW:'British Airways', CAL:'China Airlines', CCA:'Air China',
  CSN:'China Southern',    DAL:'Delta Air Lines', DLH:'Lufthansa', EIN:'Aer Lingus',
  ETD:'Etihad Airways',    ETH:'Ethiopian Airlines', EVA:'EVA Air', EWG:'Eurowings',
  EZY:'easyJet',           FDX:'FedEx', FIN:'Finnair', IBE:'Iberia',
  ICE:'Icelandair',        JAL:'Japan Airlines', JBU:'JetBlue', KAL:'Korean Air',
  KLM:'KLM',               LOT:'LOT Polish Airlines', MAS:'Malaysia Airlines',
  QFA:'Qantas',            QTR:'Qatar Airways', RYR:'Ryanair', SAS:'SAS',
  SIA:'Singapore Airlines', SWA:'Southwest Airlines', SWR:'Swiss', TAP:'TAP Air Portugal',
  THA:'Thai Airways',      THY:'Turkish Airlines', TOM:'TUI Airways', UAE:'Emirates',
  UAL:'United Airlines',   UPS:'UPS Airlines', VIR:'Virgin Atlantic', WJA:'WestJet',
  GEC:'Lufthansa Cargo',
};
const IATA_CODES = {
  AAL:'AA', AFR:'AF', AIC:'AI', ANZ:'NZ', AUA:'OS', BAW:'BA', CAL:'CI', CCA:'CA',
  CSN:'CZ', DAL:'DL', DLH:'LH', EIN:'EI', ETD:'EY', ETH:'ET', EVA:'BR', EWG:'EW',
  EZY:'U2', FDX:'FX', FIN:'AY', IBE:'IB', ICE:'FI', JAL:'JL', JBU:'B6', KAL:'KE',
  KLM:'KL', LOT:'LO', MAS:'MH', QFA:'QF', QTR:'QR', RYR:'FR', SAS:'SK', SIA:'SQ',
  SWA:'WN', SWR:'LX', TAP:'TP', THA:'TG', THY:'TK', TOM:'BY', UAE:'EK', UAL:'UA',
  UPS:'5X', VIR:'VS', WJA:'WS', GEC:'LH',
};

// ── Geometry ─────────────────────────────────────────────────────
const toRad = d => d * Math.PI / 180;
const toDeg = r => r * 180 / Math.PI;

function haversineDistance(lat1, lon1, lat2, lon2) {
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
  return 6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function haversineBearing(lat1, lon1, lat2, lon2) {
  const dLon = toRad(lon2 - lon1);
  const y = Math.sin(dLon) * Math.cos(toRad(lat2));
  const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
            Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

function parseAircraft(s, userLat, userLon) {
  if (s.lat == null || s.lon == null) return null;
  const altFt = typeof s.alt_baro === 'number' ? s.alt_baro : 0;
  if (altFt < 200) return null;

  const callsign = (s.flight || s.hex || '').trim();
  if (!callsign) return null;

  const prefix     = callsign.slice(0, 3).toUpperCase();
  const airline    = AIRLINES[prefix] || prefix;
  const iata       = IATA_CODES[prefix] || '';
  const speedMph   = Math.round((s.gs || 0) * 1.15078);
  const bearing    = haversineBearing(userLat, userLon, s.lat, s.lon);
  const distance   = haversineDistance(userLat, userLon, s.lat, s.lon);
  const overheadMin = speedMph > 0
    ? Math.min(999, Math.round((distance / speedMph) * 60))
    : 999;

  return {
    id:              (s.hex || callsign).toUpperCase(),
    callsign,
    airline,
    airlineIataCode: iata,
    model:           s.t || '',
    bearing,
    altitudeFt:      altFt,
    speedMph,
    distanceKm:      distance,
    overheadMin,
    fromCode: '', fromCity: '',
    toCode:   '', toCity:   '',
    progress: 0,
    interesting: altFt > 38000 || speedMph > 560 || !!s.mil,
    status: 'En route',
  };
}

async function pollFlights() {
  if (phoneActive) return;
  const params = new URLSearchParams(window.location.search);
  const lat = parseFloat(params.get('lat')) || DEFAULT_LAT;
  const lon = parseFloat(params.get('lon')) || DEFAULT_LON;

  try {
    const res = await fetch(`https://api.airplanes.live/v2/point/${lat}/${lon}/${RADIUS_NM}`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    const ac = json.ac || json.aircraft || [];
    const flights = ac.map(a => parseAircraft(a, lat, lon))
                      .filter(Boolean)
                      .sort((a, b) => a.distanceKm - b.distanceKm);
    if (!phoneActive && flights.length > 0) {
      updateState({
        flights,
        trackedIds:      [],
        focusedFlightId: null,
        unitSystem:      'METRIC',
        lastUpdated:     Date.now(),
      });
    }
  } catch (e) {
    console.warn('SkyLook: poll failed', e);
  }
}

pollFlights();
setInterval(pollFlights, POLL_MS);

// ── Clock ────────────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('clock').textContent = h + ':' + m;
}
updateClock();
setInterval(updateClock, 10000);

// ── Bearing helpers ──────────────────────────────────────────────
function bearingColor(bearing) {
  const a = Math.abs(((bearing % 360) + 540) % 360 - 180);
  if (a < 60)  return '#5BB3FF';
  if (a < 130) return '#9B7DFF';
  return '#FF5B7A';
}

function humanDirection(bearing, altitudeFt) {
  const dirs = ['North', 'North-East', 'East', 'South-East', 'South', 'South-West', 'West', 'North-West'];
  const dir  = dirs[Math.round(((bearing % 360) + 360) % 360 / 45) % 8];
  const elevDeg = Math.round(Math.atan2(altitudeFt * 0.3048, 10000) * 180 / Math.PI);
  if (elevDeg > 60) return 'Almost overhead';
  if (elevDeg > 30) return `${dir} — high`;
  if (elevDeg > 10) return `${dir} — mid`;
  return `${dir} — low on horizon`;
}

// ── Unit formatting ──────────────────────────────────────────────
function formatAlt(ft) {
  if (state.unitSystem === 'IMPERIAL') return Math.round(ft).toLocaleString() + ' ft';
  return Math.round(ft * 0.3048).toLocaleString() + ' m';
}
function formatSpeed(mph) {
  if (state.unitSystem === 'IMPERIAL') return Math.round(mph) + ' mph';
  return Math.round(mph * 1.60934) + ' km/h';
}
function formatDist(km) {
  if (state.unitSystem === 'IMPERIAL') return (km * 0.621371).toFixed(1) + ' mi';
  return km.toFixed(1) + ' km';
}

// ── Render ───────────────────────────────────────────────────────
function render() {
  renderStats();
  renderFreshness();
  renderFlightLists();
  renderCompass();
  renderDetail();
}

function renderStats() {
  const tracked = state.flights.filter(f => state.trackedIds.includes(f.id));
  document.getElementById('aircraft-count').textContent = state.flights.length;
  document.getElementById('tracked-count').textContent  = tracked.length;
  document.getElementById('tracked-pill').style.display = state.trackedIds.length ? '' : 'none';
}

function renderFreshness() {
  const el = document.getElementById('freshness');
  if (!state.lastUpdated) {
    el.className = 'demo'; el.textContent = 'DEMO DATA'; return;
  }
  const ageMin = Math.floor((Date.now() - state.lastUpdated) / 60000);
  el.className = ageMin <= 1 ? 'live' : 'stale';
  el.textContent = ageMin <= 1 ? 'Live' : ageMin + 'm ago';
}

function renderFlightLists() {
  const tracked    = state.flights.filter(f =>  state.trackedIds.includes(f.id));
  const nonTracked = state.flights.filter(f => !state.trackedIds.includes(f.id));
  const focusedId  = state.focusedFlightId;

  const ts = document.getElementById('tracked-section');
  ts.style.display = tracked.length ? '' : 'none';
  document.getElementById('tracked-list').innerHTML = tracked.map(f => flightRowHTML(f, focusedId)).join('');

  document.getElementById('nearby-list').innerHTML =
    nonTracked.map(f => flightRowHTML(f, focusedId)).join('');
}

function flightRowHTML(f, focusedId) {
  const color = bearingColor(f.bearing);
  const route = f.fromCode && f.toCode ? `${f.fromCode} → ${f.toCode}` : '';
  const isFocused = focusedId && f.id === focusedId;
  const isDimmed = focusedId && !isFocused;
  const cls = isFocused ? ' focused' : (isDimmed ? ' dimmed' : '');
  return `
    <div class="flight-row${cls}">
      <div class="dot" style="background:${color}"></div>
      <div class="flight-info">
        <div class="flight-callsign">${esc(f.callsign)}</div>
        ${route ? `<div class="flight-route">${esc(route)}</div>` : ''}
      </div>
      <div class="flight-dist">${formatDist(f.distanceKm)}</div>
    </div>`;
}

// ── Compass canvas ───────────────────────────────────────────────
const canvas = document.getElementById('compass');
const ctx    = canvas.getContext('2d');

function renderCompass() {
  const wrap = document.getElementById('compass-wrap');
  // The wrap is already square via aspect-ratio. Use its measured size, multiplied
  // by devicePixelRatio for crisp rendering on hi-DPI displays (Nest Hub is 2x).
  const cssSize = Math.min(wrap.clientWidth, wrap.clientHeight);
  if (cssSize < 10) { requestAnimationFrame(renderCompass); return; }
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = cssSize * dpr;
  canvas.height = cssSize * dpr;
  canvas.style.width  = cssSize + 'px';
  canvas.style.height = cssSize + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const cx = cssSize / 2, cy = cssSize / 2, R = cssSize / 2 - 6;

  ctx.clearRect(0, 0, cssSize, cssSize);

  // Background circle
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,.03)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.08)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Distance rings
  [.25, .5, .75].forEach(pct => {
    ctx.beginPath();
    ctx.arc(cx, cy, R * pct, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,.05)';
    ctx.lineWidth = 1;
    ctx.stroke();
  });

  // Cardinal labels
  const labels = [['N', 0], ['E', 90], ['S', 180], ['W', 270]];
  ctx.font = `500 ${Math.max(10, cssSize * 0.022)}px system-ui`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  labels.forEach(([lbl, deg]) => {
    const rad = (deg - 90) * Math.PI / 180;
    const lx  = cx + (R - 14) * Math.cos(rad);
    const ly  = cy + (R - 14) * Math.sin(rad);
    ctx.fillStyle = lbl === 'N' ? 'rgba(77,166,255,.9)' : 'rgba(255,255,255,.3)';
    ctx.fillText(lbl, lx, ly);
  });

  // Aircraft dots — scale dot size with canvas
  const baseDot = Math.max(3, cssSize * 0.012);
  const maxDist = Math.max(...state.flights.map(f => f.distanceKm), 1);

  // Render unfocused first, focused last so it sits on top
  const focusedId = state.focusedFlightId;
  const renderOrder = state.flights.slice().sort((a, b) => {
    if (a.id === focusedId) return 1;
    if (b.id === focusedId) return -1;
    return 0;
  });

  renderOrder.forEach(f => {
    const color   = bearingColor(f.bearing);
    const focused = f.id === focusedId;
    const tracked = state.trackedIds.includes(f.id);
    const rad     = (f.bearing - 90) * Math.PI / 180;
    const dist    = (f.distanceKm / maxDist) * R * 0.88;
    const fx      = cx + dist * Math.cos(rad);
    const fy      = cy + dist * Math.sin(rad);

    const dotR = focused ? baseDot * 2.2 : tracked ? baseDot * 1.5 : baseDot;

    if (focused) {
      // Outer halo
      ctx.beginPath();
      ctx.arc(fx, fy, dotR + 14, 0, Math.PI * 2);
      ctx.fillStyle = hexA(color, 0.12);
      ctx.fill();
      // Ring
      ctx.beginPath();
      ctx.arc(fx, fy, dotR + 5, 0, Math.PI * 2);
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(fx, fy, dotR, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.globalAlpha = focused ? 1 : tracked ? .9 : .65;
    ctx.fill();
    ctx.globalAlpha = 1;

    if (focused) {
      ctx.font = `700 ${Math.max(10, cssSize * 0.022)}px system-ui`;
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(f.callsign, fx, fy - dotR - 8);
    }
  });
}

function hexA(hex, alpha) {
  // #RRGGBB → rgba(r,g,b,a)
  const m = hex.match(/#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})/i);
  if (!m) return hex;
  return `rgba(${parseInt(m[1],16)},${parseInt(m[2],16)},${parseInt(m[3],16)},${alpha})`;
}

// ── Detail panel ─────────────────────────────────────────────────
function renderDetail() {
  const f = state.flights.find(fl => fl.id === state.focusedFlightId);
  const detail = document.getElementById('detail-panel');
  const idle   = document.getElementById('idle-panel');
  if (!f) { detail.style.display = 'none'; idle.style.display = ''; return; }

  idle.style.display = 'none';
  detail.style.display = '';
  const color = bearingColor(f.bearing);

  const progress = f.progress > 0 ? `
    <div class="progress-track">
      <div class="progress-fill" style="width:${Math.round(f.progress * 100)}%;background:${color}"></div>
    </div>` : '';

  const routeCard = f.fromCode && f.toCode ? `
    <div class="route-card">
      <div class="route-row">
        <div>
          <div class="route-iata">${esc(f.fromCode)}</div>
          <div class="route-city">${esc(f.fromCity)}</div>
        </div>
        <div class="route-arrow" style="color:${color}">✈</div>
        <div style="text-align:right; min-width:0;">
          <div class="route-iata">${esc(f.toCode)}</div>
          <div class="route-city">${esc(f.toCity)}</div>
        </div>
      </div>
      ${progress}
    </div>` : '';

  const nearestRow = f.overheadMin < 999 ? statRow('Nearest in', f.overheadMin + ' min') : '';

  detail.innerHTML = `
    <div class="detail-header">
      <div class="airline-logo">${esc(f.airlineIataCode || f.callsign.slice(0,2))}</div>
      <div style="min-width:0; flex:1;">
        <div>
          <span class="detail-callsign">${esc(f.callsign)}</span>
          ${f.interesting ? '<span class="interesting-badge">★</span>' : ''}
        </div>
        <div class="detail-airline">${esc(f.airline)}</div>
      </div>
    </div>
    <div class="where-box" style="background:${hexA(color, 0.12)}">
      <div class="where-label" style="color:${color}">WHERE TO LOOK</div>
      <div class="where-text">${humanDirection(f.bearing, f.altitudeFt)}</div>
    </div>
    ${routeCard}
    <div class="stats-grid">
      ${statRow('Altitude', formatAlt(f.altitudeFt))}
      ${statRow('Speed',    formatSpeed(f.speedMph))}
      ${statRow('Distance', formatDist(f.distanceKm))}
      ${f.model ? statRow('Aircraft', f.model) : ''}
      ${statRow('Status', f.status)}
      ${nearestRow}
    </div>`;
}

function statRow(label, value) {
  return `<div class="stat-row"><span class="stat-lbl">${esc(label)}</span><span class="stat-val">${esc(value)}</span></div>`;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Resize ───────────────────────────────────────────────────────
let resizeT;
window.addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(render, 100);
});

// ── Initial render ───────────────────────────────────────────────
render();
</script>
</body>
</html>
